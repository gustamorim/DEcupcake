{% extends 'account/auth_base.html' %}
{% block title %}Entrar | DEcupcake{% endblock %}
{% block form_content %}
<h2>Entrar</h2><p class="muted">Informe seu e-mail e senha.</p>
{% if error %}<p class="form-error" id="login-error" role="alert">{{ error }}</p>{% endif %}
<form class="auth-form" method="post" action="{{ url_for('account.login') }}" {% if error %}aria-describedby="login-error"{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field"><label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="email" value="{{ email }}" maxlength="254" required></div>
    <div class="form-field"><label for="password">Senha</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required></div>
    <button class="button" type="submit">Entrar na minha conta <span aria-hidden="true">→</span></button>
</form>
<p class="auth-switch">Ainda não tem conta? <a class="text-link" href="{{ url_for('account.register') }}">Cadastre-se</a></p>
{% endblock %}
